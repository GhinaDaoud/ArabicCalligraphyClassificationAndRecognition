model:
  name: resnet18_local_global
  num_classes: 7
  input_size: 224
  pretrained: true
  dropout: 0.3

training:
  epochs_stage1: 8
  epochs_stage2: 6
  batch_size: 8
  num_workers: 0
  seed: 42
  max_cpu_threads: 2
  max_interop_threads: 1
  throttle_seconds_per_batch: 0.0

early_stopping:
  enabled: true
  monitor: val_loss
  mode: min
  patience: 2
  min_delta: 0.0015

optimizer:
  name: adamw
  backbone_lr: 0.0001
  head_lr: 0.0005
  weight_decay: 0.0001

fine_tuning:
  unfreeze_mode: layer4
  freeze_backbone_batchnorm: true
  backbone_lr: 0.00001
  head_lr: 0.0001

scheduler:
  name: cosine
  t_max: 8
  eta_min: 0.000001

loss:
  name: cross_entropy
  label_smoothing: 0.05

imbalance:
  strategy: class_weights
  power: 0.35

augmentation:
  enable_online_aug: true
  rotation: 3.0
  translate: 0.015
  scale_min: 0.985
  scale_max: 1.015
  brightness: 0.06
  contrast: 0.06
  blur_prob: 0.08

data:
  train_csv: data/splits/train.csv
  val_csv: data/splits/val.csv
  image_root: data/processed/augmented/images
  validation_split: 0.2

paths:
  output_root: outputs/training/resnet18_local_global_lowval
